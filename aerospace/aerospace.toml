# AeroSpace — gestionnaire de fenêtres en tuiles (tiling)
# Référence : https://nikitabobko.github.io/AeroSpace/guide

# Version du schéma de config, requise par AeroSpace
config-version = 2

# Lancement automatique à la connexion
start-at-login = true

# Layout par défaut des nouveaux conteneurs de fenêtres
# 'tiles' = fenêtres placées côte à côte, sans chevauchement
default-root-container-layout = 'tiles'

# Orientation du conteneur racine : toujours horizontale (fenêtres côte à
# côte). Explicite plutôt que 'auto', pour ne jamais risquer un empilement
# vertical.
default-root-container-orientation = 'horizontal'

key-mapping.preset = 'qwerty'

# outer à 0 : une fenêtre seule occupe tout l'écran, comme avant AeroSpace.
# inner à 8 : sépare visuellement deux fenêtres quand il y en a plusieurs —
# aucune gestion manuelle nécessaire, ça découle juste du nombre de fenêtres.
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 0
outer.right = 0
outer.top = 0
outer.bottom = 0

[mode.main.binding]
# Recharge ce fichier sans relancer AeroSpace
alt-shift-r = 'reload-config'

# Déplacer le focus entre fenêtres (gauche/droite uniquement)
alt-j = 'focus left'
alt-k = 'focus right'

# Échanger la position de la fenêtre focalisée avec sa voisine
alt-shift-j = 'move left'
alt-shift-k = 'move right'

# Basculer vers un workspace
# 1 = Ghostty + VS Code (les deux candidats à un vrai split), 2 = Brave, 3 = Discord
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'

# Envoyer la fenêtre focalisée vers un workspace, sans y basculer soi-même
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'

# Règles de détection de fenêtres — évaluées dans l'ordre, la première qui
# correspond gagne. Les 4 apps ci-dessous gardent leur comportement défini
# précédemment ; tout le reste tombe dans la règle finale, qui les rend
# flottantes par défaut pour que Rectangle en reprenne le contrôle.

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = ['layout floating', 'move-node-to-workspace 2']

# Règle finale : if = 'true' matche toujours, syntaxe officielle
# recommandée par AeroSpace pour une règle sans condition.
[[on-window-detected]]
if = 'true'
run = 'layout floating'