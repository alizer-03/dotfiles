# --- Général ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # vraies couleurs 24-bit
set -g allow-passthrough on                         # aperçus image de yazi (protocole Kitty) dans un panneau tmux
set -g mouse on
set -g history-limit 50000
set -g escape-time 0                                 # supprime le délai après <Esc>, essentiel pour Neovim
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off                         # à la fermeture d'une session, bascule sur une autre au lieu d'éjecter vers un shell nu

# --- Préfixe : Ctrl+a plutôt que Ctrl+b par défaut ---
# Contrepartie : Ctrl+a est normalement "aller au début de la ligne" en shell
# (readline/emacs mode). Ctrl+a Ctrl+a (deux fois) l'envoie au shell plutôt qu'à tmux.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Découpage de panneaux, dans le répertoire courant ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Navigation façon vim entre panneaux tmux ET splits Neovim, sans préfixe
# (vim-tmux-navigator, plugin déclaré plus bas) — Ctrl+h/j/k/l passe d'un
# panneau à l'autre normalement ; si le panneau courant est Neovim, la touche
# lui est transmise telle quelle et c'est son propre mapping (core/keymaps.lua)
# qui prend le relais, y compris pour franchir la frontière tmux/nvim dans les
# deux sens. Remplace l'ancien binding préfixé (bind h/j/k/l) : redondant une
# fois ce passage fluide en place, un seul réflexe à retenir.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# --- Redimensionnement répétable + zoom plein écran d'un panneau ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z

# --- Rechargement de la config ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Config tmux rechargée"

# --- Mode copie façon vim, navigation complète ---
setw -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-u send-keys -X half-page-up
bind -T copy-mode-vi C-d send-keys -X half-page-down
bind -T copy-mode-vi g send-keys -X history-top
bind -T copy-mode-vi G send-keys -X history-bottom

# --- Popups flottants ---
bind f popup -w 80% -h 25% -x C -y C -E "~/dotfiles/tmux/tmux-sessionizer.sh"       # basculer entre projets/sessions
bind @ popup -w 100% -h 40% -x C -y 9999 -E "~/dotfiles/tmux/tmux-file-picker.sh"   # insérer un chemin de fichier dans la commande en cours
bind g popup -w 90% -h 90% -E "lazygit"                                            # LazyGit accessible même hors Neovim

# --- Statusline — style tokyonight-moon (même palette que FZF_DEFAULT_OPTS) ---
set -g status-position bottom
set -g status-style "bg=#1e2030,fg=#c8d3f5"

setw -g window-status-current-style "bg=#82aaff,fg=#1e2030,bold"
setw -g window-status-current-format " #I:#W "

setw -g window-status-style "bg=#1e2030,fg=#636da6"
setw -g window-status-format " #I:#W "

set -g status-right-style "bg=#2f334d,fg=#c8d3f5"
set -g status-right " #{pane_current_path} "
set -g status-right-length 60

# --- Plugins (via TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # sauvegarde/restaure une session (fenêtres, panneaux, process) entre deux redémarrages
set -g @plugin 'tmux-plugins/tmux-continuum'   # sauvegarde automatique en tâche de fond + restauration au lancement de tmux (utilise tmux-resurrect)
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'      # menu fzf pour gérer sessions/fenêtres/panneaux (prefix + F)
set -g @plugin 'wfxr/tmux-fzf-url'     # ouvre les URLs visibles dans le panneau via fzf (prefix + u)
set -g @plugin 'christoomey/vim-tmux-navigator'   # passage fluide Ctrl+h/j/k/l tmux <-> Neovim (voir plus haut + nvim/lua/core/keymaps.lua)

set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Garder cette ligne en tout dernier — TPM ignore tout ce qui est déclaré après.
run '~/.tmux/plugins/tpm/tpm'